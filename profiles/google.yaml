name: Google Cloud
description: Google Cloud model
terraform_provider: google
technologies:
  # end-user technologies
  - id: "browser"
    name: "browser"
    type: "technical_asset"
    terraform: ""

  - id: "desktop"
    name: "desktop"
    type: "technical_asset"
    terraform: ""

  - id: "mobile-app"
    name: "mobile-app"
    type: "technical_asset"
    terraform: ""

  - id: "client-system"
    name: "client-system"
    type: "technical_asset"
    terraform: ""

  - id: "devops-client"
    name: "devops-client"
    type: "technical_asset"
    terraform: ""

  # secuirty boundaries
  - id: "internet"
    name: "internet"
    type: "trust_boundary"
    terraform: ""

  - id: "on-premise"
    name: "on-premise"
    type: "trust_boundary"
    terraform: ""

  - id: "cloud"
    name: "cloud"
    type: "trust_boundary"
    terraform: ""

  - id: "vpc"
    name: "vpc"
    type: "trust_boundary"
    terraform: "google_compute_network"
    scaffold: |
      name                    = "{name}"
      auto_create_subnetworks = false

  - id: "subnet"
    name: "subnet"
    type: "trust_boundary"
    terraform: "google_compute_subnetwork"
    scaffold: |
      name          = "{name}"
      ip_cidr_range = "10.0.0.0/24"
      region        = var.region

      # TODO(taralizer): point at the VPC network resource, e.g.
      # google_compute_network.vpc.name
      network = "default"

  - id: "project"
    name: "project"
    type: "trust_boundary"
    terraform: "google_project"
    scaffold: |
      name       = "{name}"
      project_id = "{name}"

  # networking technologies
  - id: "waf"
    name: "waf"
    type: "technical_asset"
    # approximate mapping — Cloud Armor is the closest GCP WAF;
    # review before use
    terraform: "google_cloud_armor_security_policy"
    scaffold: |
      name = "{name}"
      type = "EXPLICIT"

      # TODO(taralizer): add rule blocks for the WAF policy

  - id: "load-balancer"
    name: "load-balancer"
    type: "technical_asset"
    terraform: ""

  - id: "reverse-proxy"
    name: "reverse-proxy"
    type: "technical_asset"
    terraform: ""

  - id: "ips"
    name: "ips"
    type: "technical_asset"
    terraform: ""

  - id: "ids"
    name: "ids"
    type: "technical_asset"
    terraform: ""

  - id: "gateway"
    name: "gateway"
    type: "technical_asset"
    terraform: ""

# storage technologies
  - id: "database"
    name: "database"
    type: "technical_asset"
    terraform: ""

  - id: "database-sql"
    name: "Cloud SQL"
    type: "technical_asset"
    terraform: "google_sql_database_instance"
    scaffold: |
      name = "{name}"

      settings {
        tier = "db-f1-micro"
      }

  - id: "database-nosql"
    name: "Datastore"
    type: "technical_asset"
    # approximate mapping — Firestore is the successor to Datastore;
    # review before use
    terraform: "google_firestore_database"
    scaffold: |
      name     = "{name}"
      location = "firestore-default-location"
      type     = "FIRESTORE_NATIVE"

  - id: "file-server"
    name: "file-server"
    type: "technical_asset"
    terraform: ""

  - id: "local-file-system"
    name: "local-file-system"
    type: "technical_asset"
    terraform: ""

  - id: "data-lake"
    name: "Big Query"
    type: "technical_asset"
    terraform: ""

  - id: "block-storage"
    name: "block-storage"
    type: "technical_asset"
    terraform: ""

  - id: "web-server"
    name: "web-server"
    type: "technical_asset"
    terraform: "google_compute_instance"
    scaffold: |
      name         = "{name}"
      machine_type = "e2-micro"

      boot_disk {
        initialize_params {
          image = "debian-cloud/debian-12"
        }
      }

      network_interface {
        # TODO(taralizer): point at the VPC network resource, e.g.
        # google_compute_network.vpc.name
        network = "default"
      }

  - id: "web-application"
    name: "web-application"
    type: "technical_asset"
    terraform: "google_compute_instance"
    scaffold: |
      name         = "{name}"
      machine_type = "e2-micro"

      boot_disk {
        initialize_params {
          image = "debian-cloud/debian-12"
        }
      }

      network_interface {
        # TODO(taralizer): point at the VPC network resource, e.g.
        # google_compute_network.vpc.name
        network = "default"
      }

  - id: "web-service-rest"
    name: "web-service-rest"
    type: "technical_asset"
    terraform: "google_compute_instance"
    scaffold: |
      name         = "{name}"
      machine_type = "e2-micro"

      boot_disk {
        initialize_params {
          image = "debian-cloud/debian-12"
        }
      }

      network_interface {
        # TODO(taralizer): point at the VPC network resource, e.g.
        # google_compute_network.vpc.name
        network = "default"
      }

  - id: "web-service-soap"
    name: "web-service-soap"
    type: "technical_asset"
    terraform: "google_compute_instance"
    scaffold: |
      name         = "{name}"
      machine_type = "e2-micro"

      boot_disk {
        initialize_params {
          image = "debian-cloud/debian-12"
        }
      }

      network_interface {
        # TODO(taralizer): point at the VPC network resource, e.g.
        # google_compute_network.vpc.name
        network = "default"
      }

  - id: "ejb"
    name: "ejb"
    terraform: ""

  - id: "erp"
    name: "erp"
    type: "technical_asset"
    terraform: ""

  - id: "cms"
    name: "cms"
    type: "technical_asset"
    terraform: ""

  - id: "search-index"
    name: "search-index"
    type: "technical_asset"
    terraform: ""

  - id: "search-engine"
    name: "search-engine"
    type: "technical_asset"
    terraform: ""

  - id: "service-registry"
    name: "service-registry"
    type: "technical_asset"
    terraform: ""

# security/authn/authz technologies
  - id: "identity-provider"
    name: "Cloud Identity"
    type: "technical_asset"
    terraform: ""

  - id: "identity-store-database"
    name: "identity-store-database"
    type: "technical_asset"
    terraform: ""

  - id: "identity-store-ldap"
    name: "identity-store-ldap"
    type: "technical_asset"
    terraform: ""

  - id: "ldap-server"
    name: "ldap-server"
    type: "technical_asset"
    terraform: ""

  - id: "hsm"
    name: "Cloud Key Management"
    type: "technical_asset"
    # approximate mapping — a KMS key ring is the closest standalone
    # GCP resource; review before use
    terraform: "google_kms_key_ring"
    scaffold: |
      name     = "{name}"
      location = var.region

  - id: "vault"
    name: "Cloud Secret"
    type: "technical_asset"
    terraform: ""

  - id: "monitoring"
    name: "Cloud Monitoring"
    type: "technical_asset"
    terraform: ""

  - id: "logging"
    name: "Cloud Logging"
    type: "technical_asset"
    # approximate mapping — a project sink to Cloud Storage is the
    # closest standalone GCP resource; review before use
    terraform: "google_logging_project_sink"
    scaffold: |
      name        = "{name}"
      destination = "storage.googleapis.com/{name}"

      # TODO(taralizer): set a filter to scope the sink

  # Integration technologies
  - id: "event-listener"
    name: "Cloud Functions"
    type: "technical_asset"
    terraform: ""


  - id: "batch-processing"
    name: "Dataproc"
    type: "technical_asset"
    terraform: ""
    
  - id: "message-queue"
    name: "Cloud Pub/Sub"
    type: "technical_asset"
    terraform: ""

  - id: "service-mesh"
    name: "Athos Dervice Mesh"
    type: "technical_asset"
    terraform: ""

  - id: "big-data-platform"
    name: "big-data-platform"
    type: "technical_asset"
    terraform: ""

  - id: "ai"
    name: "VertexAI"
    type: "technical_asset"
    terraform: ""

  - id: "mail-server"
    name: "mail-server"
    type: "technical_asset"
    terraform: ""

  - id: "stream-processing"
    name: "Dataflow"
    type: "technical_asset"
    terraform: ""

# CI/CD Pipeline
  - id: "build-pipeline"
    name: "Cloud Build"
    type: "technical_asset"
    terraform: ""

  - id: "artifact-registry"
    name: "artifact-registry"
    type: "technical_asset"
    terraform: ""

  - id: "sourcecode-repository"
    name: "sourcecode-repository"
    type: "technical_asset"
    terraform: ""

  - id: "code-inspection-platform"
    name: "code-inspection-platform"
    type: "technical_asset"
    terraform: ""


# kubernetes
  - id: "container-platform"
    name: "Google Kubernetes Engine"
    type: "technical_asset"
    terraform: "google_container_cluster"
    scaffold: |
      name     = "{name}"
      location = var.region

      # TODO(taralizer): configure node pools (initial_node_count or a
      # node_pool block)

  # Intentionally unmapped to Terraform: pods, ingress and network policies are
  # managed inside the GKE cluster (container-platform), not as standalone resources.
  - id: "kubernetes-pod"
    name: "kubernetes-pod"
    type: "technical_asset"

  - id: "kubernetes-ingress"
    name: "kubernetes-ingress"      
    type: "technical_asset"
    terraform: ""    
      
  - id: "kubernetes-service"
    name: "kubernetes-service"      
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-deployment"
    name: "kubernetes-deployment"      
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-configmap"
    name: "kubernetes-configmap"      
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-statefulset"
    name: "kubernetes-statefulset"
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-secret"
    name: "kubernetes-secret"
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-daemonset"
    name: "kubernetes-daemonset"
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-job"
    name: "kubernetes-job"      
    type: "technical_asset"
    terraform: ""

  - id: "kubernetes-cronjob"
    name: "kubernetes-cronjob"      
    type: "technical_asset"
    terraform: ""
