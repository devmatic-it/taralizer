###############################################################################
# Taralizer Goreleaser config file (GoReleaser v2)
###############################################################################
version: 2
project_name: taralizer

before:
  hooks:
    - go mod tidy

builds:
  - id: taralizer
    env:
      - CGO_ENABLED=0
    main: ./main.go
    goos:
      - linux
      - darwin
      - windows
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: linux
        goarch: arm
      - goos: windows
        goarch: "386"
    ldflags:
      - -s -w -X github.com/devmatic-it/taralizer/cmd.ProductVersion={{.Version}}

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

archives:
  - id: taralizer
    ids:
      - taralizer
    formats:
      - zip
    files:
      - LICENSE
      - AUTHORS
      - rules/**
      - templates/**
      - profiles/**
      - examples/**
